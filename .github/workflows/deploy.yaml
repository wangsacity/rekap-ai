on:
  push:
    branches:
      - master
jobs:
  build-and-upload-to-docker-hub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create .env.production file
        run: |
          echo "${{ secrets.PRODUCTION_ENV_FILE }}" > .env.production

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: wangsact/rekap-ai:latest

  deploy-vm2:
    runs-on: ubuntu-latest
    needs: build-and-upload-to-docker-hub
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}
      - name: Deploy to VM
        env:
          HOST: ${{ secrets.VM_HOST }}
          USER: ${{ secrets.VM_USERNAME }}
          PORT: ${{ secrets.VM_PORT }}
        run: |
          ssh -o StrictHostKeyChecking=no -p "${PORT}" $USER@$HOST << 'EOF'
            docker pull wangsact/rekap-ai:latest
            if [ "$(docker ps -aq -f name=rekap-ai-run)" ]; then
              if [ "$(docker ps -q -f name=rekap-ai-run)" ]; then
                docker stop rekap-ai-run
              fi
              docker container rm rekap-ai-run
              docker run -d --name rekap-ai-run --restart unless-stopped --network my-app -p 6000:3000 wangsact/rekap-ai:latest
            else
              docker run -d --name rekap-ai-run --restart unless-stopped --network my-app -p 6000:3000 wangsact/rekap-ai:latest
            fi
            docker image prune -f
          EOF